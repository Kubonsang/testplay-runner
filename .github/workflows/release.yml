name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          # Go 1.24+ emits Mach-O LC_UUID, required by macOS 26 for the
          # cross-compiled Darwin artifacts while the module remains Go 1.22 compatible.
          go-version: "1.26.4"

      - name: Verify release metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          source_version="$(sed -n 's/^var version = "\(v[^"]*\)"$/\1/p' cmd/testplay/version.go)"
          package_version="$(jq -r .version unity/com.testplay.bridge/package.json)"
          test "$source_version" = "$RELEASE_VERSION"
          test "$package_version" = "${RELEASE_VERSION#v}"

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "v2.17.0"
          args: >-
            release --clean
            --release-notes docs/28_v0.12.0_release_notes.md
            --release-footer docs/29_v0.12.0_release_notes.ko.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
