name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate tag, including the leading v
        required: true
        default: v0.12.0
      previous_tag:
        description: Previous release tag used for changelog calculation
        required: true
        default: v0.11.0

permissions:
  contents: read

jobs:
  build:
    name: Build snapshot and verify inventory
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Confirm metadata and toolchain
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.26.4"
          source_version="$(sed -n 's/^var version = "\(v[^"]*\)"$/\1/p' cmd/testplay/version.go)"
          package_version="$(jq -r .version unity/com.testplay.bridge/package.json)"
          test "$source_version" = "$RELEASE_VERSION"
          test "$package_version" = "${RELEASE_VERSION#v}"

      - name: Run tests and vet
        run: |
          go test ./...
          go vet ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.17.0"
          args: release --snapshot --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ inputs.version }}
          GORELEASER_PREVIOUS_TAG: ${{ inputs.previous_tag }}

      - name: Verify archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            ([.[] | select(.type == "Archive") |
              (.extra.ID + "/" + .goos + "/" + .goarch + "/" +
                (if (.name | endswith(".zip")) then "zip" else "tar.gz" end))
             ] | sort)
            ==
            [
              "testplay-storage-helper/darwin/amd64/tar.gz",
              "testplay-storage-helper/darwin/arm64/tar.gz",
              "testplay-storage-helper/linux/amd64/tar.gz",
              "testplay-storage-helper/windows/amd64/zip",
              "testplay/darwin/amd64/tar.gz",
              "testplay/darwin/arm64/tar.gz",
              "testplay/linux/amd64/tar.gz",
              "testplay/linux/arm64/tar.gz",
              "testplay/windows/amd64/zip"
            ]
          ' dist/artifacts.json
          test "$(awk 'NF { n++ } END { print n+0 }' dist/checksums.txt)" -eq 9
          diff -u \
            <(jq -r '.[] | select(.type == "Archive") | .name' dist/artifacts.json | sort) \
            <(awk '{print $2}' dist/checksums.txt | sort)
          (cd dist && sha256sum --check checksums.txt)

          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            archive="$(find dist -maxdepth 1 -name "testplay_*_${target}.tar.gz" -print -quit)"
            test -n "$archive"
            listing="$(tar -tzf "$archive")"
            grep -qx 'testplay' <<<"$listing"
            if grep -qx 'testplay-storage-helper' <<<"$listing"; then
              echo "unexpected helper in CLI $target archive" >&2
              exit 1
            fi
          done

          cli_windows_archive="$(find dist -maxdepth 1 -name 'testplay_*_windows_amd64.zip' -print -quit)"
          test -n "$cli_windows_archive"
          cli_windows_listing="$(unzip -Z1 "$cli_windows_archive")"
          grep -qx 'testplay.exe' <<<"$cli_windows_listing"

          for target in darwin_amd64 darwin_arm64 linux_amd64; do
            archive="$(find dist -maxdepth 1 -name "testplay-storage-helper_*_${target}.tar.gz" -print -quit)"
            test -n "$archive"
            listing="$(tar -tzf "$archive")"
            grep -qx 'testplay-storage-helper' <<<"$listing"
          done

          helper_windows_archive="$(find dist -maxdepth 1 -name 'testplay-storage-helper_*_windows_amd64.zip' -print -quit)"
          test -n "$helper_windows_archive"
          helper_windows_listing="$(unzip -Z1 "$helper_windows_archive")"
          grep -qx 'testplay-storage-helper.exe' <<<"$helper_windows_listing"

      - name: Execute Linux candidate
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          archive="$(find dist -maxdepth 1 -name 'testplay_*_linux_amd64.tar.gz' -print -quit)"
          helper_archive="$(find dist -maxdepth 1 -name 'testplay-storage-helper_*_linux_amd64.tar.gz' -print -quit)"
          mkdir extracted-linux
          tar -xzf "$archive" -C extracted-linux
          tar -xzf "$helper_archive" -C extracted-linux
          ./extracted-linux/testplay version | jq -e \
            --arg prefix "${RELEASE_VERSION}-SNAPSHOT-" '
            .schema_version == "1"
            and (.version | startswith($prefix))
            and (.commit | length > 0)
            and (.date | length > 0)
          '
          printf '%s\n' \
            '{"schemaVersion":1,"operation":"hello","requestId":"release-smoke"}' |
            ./extracted-linux/testplay-storage-helper | jq -e '
              .schemaVersion == 1
              and .requestId == "release-smoke"
              and .ok == true
              and .helperVersion == "v2"
              and .provider == "linux-reflink"
              and .requiresElevation == false
            '

      - uses: actions/upload-artifact@v4
        with:
          name: release-preflight-dist
          path: dist/**
          if-no-files-found: error
          retention-days: 3

  verify-darwin:
    name: Verify Darwin Mach-O artifacts
    needs: build
    runs-on: macos-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-preflight-dist
          path: dist

      - name: Verify LC_UUID and execute arm64 candidate
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            archive="$(find dist -maxdepth 1 -name "testplay_*_darwin_${arch}.tar.gz" -print -quit)"
            helper_archive="$(find dist -maxdepth 1 -name "testplay-storage-helper_*_darwin_${arch}.tar.gz" -print -quit)"
            out="$RUNNER_TEMP/darwin-$arch"
            mkdir -p "$out"
            tar -xzf "$archive" -C "$out"
            tar -xzf "$helper_archive" -C "$out"
            for binary in testplay testplay-storage-helper; do
              count="$(otool -l "$out/$binary" |
                awk '$1 == "cmd" && $2 == "LC_UUID" { n++ } END { print n+0 }')"
              test "$count" -eq 1
            done
          done
          chmod +x "$RUNNER_TEMP/darwin-arm64/testplay"
          "$RUNNER_TEMP/darwin-arm64/testplay" version | jq -e \
            --arg prefix "${RELEASE_VERSION}-SNAPSHOT-" '
            .schema_version == "1"
            and (.version | startswith($prefix))
            and (.commit | length > 0)
            and (.date | length > 0)
          '
          chmod +x "$RUNNER_TEMP/darwin-arm64/testplay-storage-helper"
          printf '%s\n' \
            '{"schemaVersion":1,"operation":"hello","requestId":"release-smoke"}' |
            "$RUNNER_TEMP/darwin-arm64/testplay-storage-helper" | jq -e '
              .schemaVersion == 1
              and .requestId == "release-smoke"
              and .ok == true
              and .helperVersion == "v2"
              and .provider == "apfs-clonefile"
              and .requiresElevation == false
            '
